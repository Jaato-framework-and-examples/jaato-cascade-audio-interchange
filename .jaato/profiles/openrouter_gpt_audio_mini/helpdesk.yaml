name: helpdesk
# `voice` plus the systems an operator actually touches.
#
# Inherits `_base_voice` for the same reason `voice` does: no completion
# schema, so the session survives the whole call.  What it adds is the
# service connector, because a helpdesk that cannot look anything up
# answers every question with "no puedo consultarlo desde aqui", which
# demonstrates nothing.
inherits: [_base_voice]
description: A simulated insurance helpdesk that can find your policy and open a claim.
# ONE tool, eagerly.  `mode:preload` puts it in the initial schema so a
# spoken turn never spends a round trip on `list_tools`; `tools:[...]`
# drops the plugin's other eight from the wire body AND the grammar
# surface, which matters here for a reason it would not in a text agent:
# every tool in the schema is a name this model might read out loud.
plugins:
  - "service_connector(mode:preload, tools:[call_service])"

# Required at top level even though the tier declares both (#822).
model: openai/gpt-audio-mini
provider: openrouter

# TWO TIERS, because tools and speech want different models.
#
# A tier carries a model, a provider, modalities and an exit rule -- NOT
# tools.  The tool schema is session-wide and sits in the prompt-cache
# prefix, so both tiers see `call_service`; what a tier changes is WHICH
# MODEL is at the wheel when the decision to call it is made.  That is
# the whole point here: gpt-audio-mini called `buscar-poliza` correctly
# and then, asked to open the parte, SAID "voy a abrir el parte" and
# called nothing.  Announcing a tool instead of invoking it is this
# model's documented weakness (see KNOWN_ISSUES), and no amount of
# persona wording makes a weak tool-caller a strong one.
#
# The session STARTS in `voice` and not in `planner` as `duet` does,
# because here the INPUT is audio: a text planner cannot hear the
# caller, so it cannot be the tier the utterance arrives at.
model_tiers:
  # One tier that both HEARS and SPEAKS.  `bidirectional` is not two
  # roles bolted together: outbound makes the daemon ask for
  # `modalities: [text, audio]` on the request, inbound is what lets an
  # `audio/*` attachment reach the wire as an `input_audio` block
  # instead of being withheld (#830).  Declaring only `outbound` here
  # would leave the model speaking into a room it cannot hear.
  #
  # Named `voice`, not `executor`.  Tier names stopped being a closed
  # set in #831: a deployment names its own, subject to
  # `^[a-z][a-z0-9_]{1,31}$`, and a free name MUST carry a `description`
  # because that is what a canonical name gets for free.  `executor`
  # would have been this tier's name under the old rule purely because
  # it was "the one doing the work" — which said nothing about what it
  # does.  The four canonical names still carry framework meaning;
  # `vision` alone implies a modality role, so this tier states its own.
  voice:
    model: openai/gpt-audio-mini
    provider: openrouter
    modalities: {audio: bidirectional}
    description: 'hears the question as audio and answers out loud'
  # Entered to touch the systems, and left again on its own.  A text
  # model that is good at tool calls, doing the one thing the audio
  # model is bad at.  `exit_on: completion` means ONE completion here
  # and control returns -- without the entered model having to hand
  # back, which the audio tier never did unprompted in four measured
  # runs of `duet`.
  planner:
    model: openai/gpt-4o-mini
    provider: openrouter
    exit_on: completion
    description: 'consults the policy systems and opens the parte; you return automatically'
  initial: voice
  fallback: voice

env:
  JAATO_OPENROUTER_API_KEY: pass://jaato/openrouter/api-key
  # Where `mock_helpdesk.py` listens.  `_service.yaml` interpolates it
  # into the base_url, so the catalog carries no port of its own.
  JAATO_HELPDESK_PORT: '8731'

plugin_configs:
  # `call_service` is gated, and this driver answers no permission
  # prompts -- a spoken call has nowhere to show one and nobody to click
  # it.  Unanswered, the turn simply stops: the session went quiet with
  # no error and the script exited having spoken two turns of four.
  #
  # Whitelisted rather than `defaultPolicy: allow`, so this grants
  # exactly the one tool the profile exposes and nothing it might gain
  # later.
  permission:
    policy:
      defaultPolicy: deny
      whitelist:
        tools:
        - call_service
        # The hand-off itself.  Whitelisted for the same reason: a
        # spoken call cannot answer a prompt, and a denied `enter_tier`
        # would strand the audio tier holding data it cannot act on.
        - enter_tier

  openrouter:
    api_key: "${JAATO_OPENROUTER_API_KEY}"
    framework_overrides:
      # ASSERTS what the model can emit.  No catalog in the tree reports
      # output modalities, so without this the floor stays text-only and
      # the tier's outbound role is refused at startup — which is exactly
      # how this profile failed the first time it ran.
      output_modalities: [text, audio]
    api_params:
      # NO temperature — see speaker.yaml: 0.0 makes this model loop
      # catastrophically (818s of speech for a one-sentence answer).
      audio:
        voice: alloy
        format: pcm16
