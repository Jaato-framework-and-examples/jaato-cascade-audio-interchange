name: duet
# Inherits the SPEAKER base, not a copy of it.  The stage contract is
# identical -- no plugins, no base instructions, the same
# completion_payload_schema -- and the only thing duet adds is a second
# tier, which lives here.  A `_base_duet` did exist and was a verbatim
# copy that had already lost two field descriptions; the reason given
# for it (keeping the single-tier demo untouched) was not a reason,
# since inheriting changes nothing in the parent.
inherits: [_base_speaker]
description: Text model answers and completes; an audio tier speaks the answer.
plugins: []

# Required at top level even though every tier declares both (#822).
model: openai/gpt-4o-mini
provider: openrouter

model_tiers:
  # The session STARTS here: a text model, no outbound role.
  planner:
    model: openai/gpt-4o-mini
    provider: openrouter
    description: 'decides the answer and closes the session; cannot speak'
  # Entered only to say the answer out loud.
  executor:
    model: openai/gpt-audio-mini
    provider: openrouter
    modalities: {audio: outbound}
    # Entered, speaks once, left again — without the audio model doing
    # anything.  It never handed back on its own in four measured runs.
    exit_on: completion
    description: 'says a sentence out loud; you return automatically'
  initial: planner
  fallback: planner

# Refuse a completion whose `spoken` was never spoken.  The schema
# checks the payload's SHAPE; this checks its TRUTH against the
# session's own tool-call ledger.  `fail_completion` returns the error
# to the model, which then has a turn to do it properly.
completion_processors:
  - script: scripts/processors/spoken_was_spoken.py
    name: spoken_was_spoken
    on_error: fail_completion
    description: '`spoken` requires that the executor tier was actually entered'

trace:
  provider_log: .jaato/logs/duet_trace.jsonl

env:
  JAATO_OPENROUTER_API_KEY: "pass://jaato/openrouter/api-key"

plugin_configs:
  openrouter:
    api_key: "${JAATO_OPENROUTER_API_KEY}"
    framework_overrides:
      # Provider-WIDE assertion, though only the executor's model can
      # actually emit audio — one of the things this experiment tests.
      output_modalities: [text, audio]
    api_params:
      audio:
        voice: alloy
        format: pcm16
