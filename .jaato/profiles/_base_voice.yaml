# Tier-1 base for the 'voice' stage — PROVIDER-AGNOSTIC.
# Holds stage determinism (plugins, permission policy).  The active
# model + provider live in profiles/<set>/voice.yaml, selected by
# JAATO_PROFILE_SET.  This base MUST stay inherit-able — binding a
# provider/model here breaks set-selection.
#
# No plugins: the stage answers from what it heard.  Every tool the
# model could call is a chance for it to emit a tool call instead of
# speech, which is the one thing this stage exists to produce.
name: _base_voice
description: Hears a spoken question and answers out loud, turn after turn (base; bind provider/model in a set).
plugins: []

# Drop the framework's injected instruction layers.  This stage answers
# questions out loud with no tools, so the disk instructions and the
# framework prompt constants (task-completion/verification, parallel
# batching, turn summaries) are all about work it cannot do — and an
# audio model pays for that prompt on every turn.
#
# `true` keeps the persona, the plugin instructions AND the
# untrusted-content security boundary; only `disk` and `constants` go.
suppress_base_instructions: true

# NO completion gating, and that is the whole difference from
# `_base_speaker`.
#
# Declaring a `completion_payload_schema` is what enables
# `signal_completion`, and calling it is what makes the session
# QUIESCENT: the daemon emits SESSION_TERMINATED and releases the
# runner.  For a one-shot stage that is exactly right -- it is how the
# cascade driver knows the answer is final.
#
# A conversation is not one-shot.  Completing after every reply ends the
# session the listener is still talking to, and the next utterance then
# replays a history whose `tool_calls` never got their tool response --
# observed as `400 ... tool_call_ids did not have response messages` on
# the SECOND question from a real microphone, and as a hang when the
# same audio was sent twice.
#
# Neither resume verb rescues that shape, because neither carries audio:
# `session.wake` takes `{session_id, text, source?, event_id?}` and
# `inject_prompt` takes `text` (see #845).  So the session must simply
# stay alive, and the driver asks again.  It ends when the person stops
# talking to it, which is what ending a conversation means.
