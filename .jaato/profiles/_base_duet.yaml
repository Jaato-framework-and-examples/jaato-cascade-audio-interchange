# Tier-1 base for the TWO-TIER experiment: a text model decides and
# completes, an audio model speaks.  Deliberately separate from
# _base_speaker so the working single-tier demo is untouched.
name: _base_duet
description: Text model answers and completes; audio tier speaks the answer.
plugins: []
suppress_base_instructions: true

completion_payload_schema:
  type: object
  additionalProperties: false
  required: [spoken, warnings, errors]
  properties:
    spoken:
      type: string
      description: The sentence that was spoken aloud.
    warnings:
      type: array
      items: {type: string}
    errors:
      type: array
      items: {type: string}
